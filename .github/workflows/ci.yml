name: Continuous Integration (CI) & SonarQube Analysis

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test, Build & Sonar Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Requerido para SonarQube Cloud

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 1. Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 2. Check Code Style & Lint
        working-directory: ./frontend
        run: |
          npm run format:check
          npm run lint

      - name: 3. Type Checking
        working-directory: ./frontend
        run: npm run type-check

      - name: 4. Run Unit Tests with Coverage
        working-directory: ./frontend
        run: npm run test:coverage

      - name: 5. Dry-run Production Build
        working-directory: ./frontend
        run: npm run build

      - name: 6. SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v4.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend